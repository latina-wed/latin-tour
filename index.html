<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中南美出團監控看板</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            cream: {
              bg: '#FBF1E4',
              soft: '#FDEBD6',
              card: '#FFFDF9',
              border: '#EADBC8',
            },
            aqua: {
              soft: '#E8F5F7',
              main: '#C2E5EA',
              deep: '#214E57',
            },
            apricot: '#E29557',
            terracotta: '#CC5E3E',
            ink: {
              main: '#382A23',
              sub: '#7A685E',
              muted: '#A39287',
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter + Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* 所有時鐘與日期維持等寬數字，避免跳動 */
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* 暖調極簡細捲軸 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(163, 146, 135, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(122, 104, 94, 0.55); }

    /* 抽屜滑出過渡 */
    #detail-drawer { transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>

<body class="min-h-screen bg-[#FBF1E4] text-[#382A23] antialiased selection:bg-[#C2E5EA] selection:text-[#214E57]">
  <!-- ==================== 1. 極簡頂部列 ==================== -->
  <header class="sticky top-0 z-30 bg-[#FFFDF9]/95 backdrop-blur border-b border-[#EADBC8]">
    <div class="max-w-[1120px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- 左側：標題與即時主時鐘（自動偵測所在地時區） -->
      <div class="flex flex-wrap items-center gap-2.5 sm:gap-4 w-full sm:w-auto">
        <h1 class="text-lg sm:text-[15px] font-semibold tracking-tight text-[#382A23]">
          中南美出團監控
        </h1>
        <div class="h-4 w-px bg-[#EADBC8] hidden sm:block"></div>
        <div class="inline-flex flex-wrap items-center gap-2 sm:gap-2.5 px-3.5 py-2 sm:py-1.5 rounded-xl bg-[#FDEBD6] border border-[#EADBC8] tabular-nums">
          <span id="live-dot" class="w-2.5 h-2.5 rounded-full bg-[#CC5E3E] shrink-0"></span>
          <span id="local-tz-label" class="text-base sm:text-xs font-semibold text-[#7A685E]">台北</span>
          <span id="taipei-date-text" class="text-base sm:text-sm font-semibold text-[#382A23]">----/--/-- (週-)</span>
          <span id="taipei-time-text" class="text-xl sm:text-lg font-bold tracking-tight text-[#CC5E3E] leading-none">--:--:--</span>
          <span id="sim-badge" class="hidden px-2 sm:px-1.5 py-0.5 rounded bg-[#FFFDF9] border border-[#EADBC8] text-[#CC5E3E] text-sm sm:text-[11px] font-semibold">模擬中</span>
        </div>
        <!-- 位於海外時才顯示的低調台北參考時間 -->
        <div id="taipei-secondary-clock" class="hidden inline-flex items-center gap-1.5 text-base sm:text-xs text-[#A39287] tabular-nums">
          <span>台北</span>
          <span id="taipei-sec-text">--/-- --:--</span>
        </div>
      </div>

      <!-- 右側：極簡篩選膠囊、時間模擬文字鈕、雲端同步按鈕 -->
      <div class="flex flex-wrap items-center gap-2 sm:gap-2.5">
        <!-- 分段篩選器：進行中 / 全部 -->
        <div id="filter-segment" class="inline-flex items-center p-1 sm:p-0.5 rounded-full bg-[#FDEBD6] border border-[#EADBC8] text-base sm:text-xs">
          <!-- JS 動態渲染 -->
        </div>

        <!-- 時間模擬文字按鈕 -->
        <button id="toggle-sim-btn" type="button" class="px-3.5 sm:px-2.5 py-2 sm:py-1.5 rounded-lg text-base sm:text-xs font-medium text-[#7A685E] hover:text-[#382A23] hover:bg-[#FDEBD6]/70 transition cursor-pointer">
          時間模擬
        </button>

        <!-- Google Drive 同步狀態與手動刷新按鈕 -->
        <button id="sync-drive-btn" type="button" class="inline-flex items-center gap-1.5 px-3.5 sm:px-3 py-2 sm:py-1.5 rounded-lg text-base sm:text-xs font-medium text-[#214E57] bg-[#E8F5F7] border border-[#C2E5EA] hover:bg-[#C2E5EA]/70 transition cursor-pointer" title="立即從 Google Drive 同步最新行程與航班動態">
          <span id="sync-icon" class="inline-block">↻</span>
          <span id="sync-label">雲端同步</span>
        </button>
      </div>
    </div>

    <!-- ==================== 2. 收合式時間模擬列（預設隱藏） ==================== -->
    <div id="simulator-strip" class="hidden border-t border-[#C2E5EA] bg-[#E8F5F7]">
      <div class="max-w-[1120px] mx-auto px-4 sm:px-6 py-3 sm:py-2.5 flex flex-wrap items-center justify-between gap-3 sm:gap-2.5 text-base sm:text-xs">
        <div class="flex flex-wrap items-center gap-2">
          <span id="sim-tz-label" class="text-[#214E57] font-medium">台北基準時間</span>
          <input id="sim-datetime-input" type="datetime-local" class="px-3 sm:px-2.5 py-1.5 sm:py-1 rounded-lg bg-[#FFFDF9] border border-[#C2E5EA] text-[#382A23] tabular-nums focus:outline-none focus:border-[#E29557]" />
          <div class="inline-flex items-center rounded-lg border border-[#C2E5EA] bg-[#FFFDF9] overflow-hidden divide-x divide-[#C2E5EA]">
            <button type="button" data-step="-6" class="px-3 sm:px-2 py-1.5 sm:py-1 text-[#214E57] hover:bg-[#C2E5EA]/40 transition cursor-pointer">-6h</button>
            <button type="button" data-step="-1" class="px-3 sm:px-2 py-1.5 sm:py-1 text-[#214E57] hover:bg-[#C2E5EA]/40 transition cursor-pointer">-1h</button>
            <button type="button" data-step="1"  class="px-3 sm:px-2 py-1.5 sm:py-1 text-[#214E57] hover:bg-[#C2E5EA]/40 transition cursor-pointer">+1h</button>
            <button type="button" data-step="6"  class="px-3 sm:px-2 py-1.5 sm:py-1 text-[#214E57] hover:bg-[#C2E5EA]/40 transition cursor-pointer">+6h</button>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 sm:gap-1.5">
          <span class="text-[#214E57] font-medium">所在地時區</span>
          <select id="sim-tz-select" class="max-w-full sm:max-w-[260px] px-2.5 sm:px-2 py-1.5 sm:py-1 rounded-lg bg-[#FFFDF9] border border-[#C2E5EA] text-[#382A23] focus:outline-none focus:border-[#E29557] cursor-pointer">
            <option value="auto">自動偵測</option>
          </select>
          <button type="button" data-preset="now" class="px-3.5 sm:px-3 py-1.5 sm:py-1 rounded-lg bg-[#FFFDF9] border border-[#C2E5EA] font-medium text-[#214E57] hover:bg-[#C2E5EA]/60 transition cursor-pointer">即時現在</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== 3. 主區域：乾淨 2 欄團體卡片 ==================== -->
  <main class="max-w-[1120px] mx-auto px-4 sm:px-6 py-8 sm:py-10">
    <div id="tour-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- JS 動態渲染極簡團體卡片 -->
    </div>
  </main>

  <!-- ==================== 4. 右側滑出式抽屜：完整雙時區時間軸 ==================== -->
  <div id="drawer-backdrop" class="fixed inset-0 z-40 hidden bg-[#382A23]/30 backdrop-blur-[1px] transition-opacity"></div>

  <aside id="detail-drawer" class="fixed top-0 right-0 z-50 h-full w-full max-w-2xl translate-x-full bg-[#FFFDF9] border-l border-[#EADBC8] flex flex-col">
    <!-- 抽屜暖奶油表頭 -->
    <div class="px-4 sm:px-6 py-4 bg-[#FDEBD6] border-b border-[#EADBC8] flex items-start justify-between gap-3 sm:gap-4 shrink-0">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <span id="drawer-dot" class="w-3 sm:w-2.5 h-3 sm:h-2.5 rounded-full shrink-0"></span>
          <h2 id="drawer-code" class="text-xl sm:text-base font-semibold text-[#382A23] tracking-tight"></h2>
          <span id="drawer-status" class="px-2.5 py-0.5 rounded-full text-sm sm:text-[11px] font-medium bg-[#FFFDF9] text-[#7A685E] border border-[#EADBC8]"></span>
        </div>
        <div class="flex items-center gap-2.5 sm:gap-2 mt-1.5">
          <p id="drawer-subtitle" class="text-base sm:text-xs text-[#7A685E] truncate cursor-pointer hover:text-[#382A23]" title="點擊編輯團體路線名稱"></p>
          <button id="drawer-edit-tour-btn" type="button" class="text-sm sm:text-[11px] font-medium text-[#CC5E3E] hover:underline shrink-0 cursor-pointer">編輯資訊</button>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="drawer-toggle-add-btn" type="button" class="px-3.5 sm:px-3 py-2 sm:py-1.5 rounded-lg text-base sm:text-xs font-medium text-[#FFFDF9] bg-[#CC5E3E] hover:bg-[#B84F31] transition cursor-pointer">
          ＋ 新增行程
        </button>
        <button id="drawer-del-tour-btn" type="button" class="px-2.5 py-2 sm:py-1.5 rounded-lg text-base sm:text-xs font-medium text-[#7A685E] hover:text-[#CC5E3E] hover:bg-[#FFFDF9]/70 transition cursor-pointer">
          刪除
        </button>
        <button id="drawer-close-btn" type="button" class="w-10 h-10 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center text-lg sm:text-sm text-[#7A685E] hover:text-[#382A23] hover:bg-[#FFFDF9]/70 transition cursor-pointer" aria-label="關閉">
          ✕
        </button>
      </div>
    </div>

    <!-- 刪除團體內嵌確認列 -->
    <div id="drawer-del-confirm" class="hidden px-4 sm:px-6 py-3 sm:py-2.5 bg-[#FFF4F0] border-b border-[#CC5E3E]/30 flex items-center justify-between gap-2 text-sm sm:text-xs shrink-0">
      <span class="text-[#CC5E3E] font-medium">確定要永久刪除此團體的所有行程嗎？</span>
      <div class="flex items-center gap-2">
        <button id="drawer-del-cancel" type="button" class="px-3 sm:px-2.5 py-1.5 sm:py-1 rounded-md bg-[#FFFDF9] border border-[#EADBC8] text-[#7A685E] cursor-pointer">取消</button>
        <button id="drawer-del-ok" type="button" class="px-3 sm:px-2.5 py-1.5 sm:py-1 rounded-md bg-[#CC5E3E] text-[#FFFDF9] font-medium hover:bg-[#B84F31] cursor-pointer">確認刪除</button>
      </div>
    </div>

    <!-- 編輯團體基本資訊表單（預設收合） -->
    <div id="drawer-edit-tour-form" class="hidden px-4 sm:px-6 py-4 bg-[#FBF1E4] border-b border-[#EADBC8] space-y-3 shrink-0">
      <div class="flex items-center justify-between">
        <span class="text-base sm:text-xs font-semibold text-[#382A23]">編輯團體資訊</span>
        <button id="tour-info-cancel" type="button" class="text-sm sm:text-xs text-[#7A685E] hover:text-[#382A23] cursor-pointer">取消</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-2.5 text-base sm:text-xs">
        <div>
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">團號 *</label>
          <input id="edit-tour-code" type="text" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]" />
        </div>
        <div>
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">團體 / 路線名稱（顯示於卡片）</label>
          <input id="edit-tour-name" type="text" placeholder="自由填寫或留空" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]" />
        </div>
      </div>
      <div class="flex justify-end">
        <button id="tour-info-save" type="button" class="px-5 sm:px-4 py-2 sm:py-1.5 rounded-lg bg-[#CC5E3E] text-[#FFFDF9] text-base sm:text-xs font-medium hover:bg-[#B84F31] cursor-pointer">
          儲存變更
        </button>
      </div>
    </div>

    <!-- 新增 / 編輯單筆項目表單（預設收合） -->
    <div id="drawer-add-form" class="hidden px-4 sm:px-6 py-4 bg-[#FBF1E4] border-b border-[#EADBC8] space-y-3 shrink-0">
      <div class="flex items-center justify-between">
        <span id="drawer-form-heading" class="text-base sm:text-xs font-semibold text-[#382A23]">新增行程 / 航班項目</span>
        <button id="drawer-form-cancel" type="button" class="text-sm sm:text-xs text-[#7A685E] hover:text-[#382A23] cursor-pointer">取消</button>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-2.5 text-base sm:text-xs">
        <div>
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">當地日期</label>
          <input id="item-date" type="date" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]" />
        </div>
        <div>
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">開始時間</label>
          <input id="item-start" type="time" value="09:00" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]" />
        </div>
        <div>
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">結束時間</label>
          <input id="item-end" type="time" value="12:00" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]" />
        </div>
        <div>
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">類型</label>
          <select id="item-type" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]">
            <option value="tour">景點 / 行程</option>
            <option value="flight">✈️ 航班</option>
            <option value="train">🚂 火車</option>
            <option value="boat">🚢 遊船</option>
            <option value="meal">🍽️ 餐食</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">出發 / 當地城市</label>
          <select id="item-city" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]"></select>
        </div>
        <div class="col-span-2">
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">抵達城市（跨時區航班才需選）</label>
          <select id="item-endcity" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]"></select>
        </div>
        <div class="col-span-2">
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">行程 / 航班名稱 *</label>
          <input id="item-title" type="text" placeholder="例如：LA-2061 LIM → CUZ" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]" />
        </div>
        <div class="col-span-2 flex items-end gap-2">
          <div class="flex-1">
            <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">當晚住宿（選填）</label>
            <input id="item-hotel" type="text" placeholder="飯店名稱" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#E29557]" />
          </div>
          <button id="item-save-btn" type="button" class="px-4 sm:px-3.5 py-2 sm:py-1.5 rounded-lg bg-[#CC5E3E] text-[#FFFDF9] font-medium hover:bg-[#B84F31] cursor-pointer shrink-0">
            儲存
          </button>
        </div>
      </div>
    </div>

    <!-- 班機延誤 / 改時快速調整面板（預設收合） -->
    <div id="drawer-delay-form" class="hidden px-4 sm:px-6 py-4 bg-[#FFF4F0] border-b border-[#CC5E3E]/30 space-y-3 shrink-0">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="px-2 sm:px-1.5 py-0.5 rounded bg-[#CC5E3E] text-[#FFFDF9] text-xs sm:text-[10px] font-semibold shrink-0">延誤 / 改時</span>
          <span id="delay-form-title" class="text-base sm:text-xs font-semibold text-[#382A23] truncate"></span>
        </div>
        <div class="flex items-center gap-3 text-sm sm:text-xs shrink-0">
          <a id="delay-lookup-google" href="#" target="_blank" rel="noopener noreferrer" class="hidden text-[#214E57] hover:text-[#CC5E3E] font-medium">Google 動態 ↗</a>
          <a id="delay-lookup-fr24" href="#" target="_blank" rel="noopener noreferrer" class="hidden text-[#214E57] hover:text-[#CC5E3E] font-medium">FR24 ↗</a>
          <button id="delay-form-cancel" type="button" class="text-[#7A685E] hover:text-[#382A23] cursor-pointer">取消</button>
        </div>
      </div>

      <!-- 原定時間參考與快捷延誤鈕 -->
      <div class="flex flex-wrap items-center justify-between gap-2 text-sm sm:text-xs">
        <span id="delay-orig-ref" class="text-sm sm:text-[11px] text-[#7A685E] tabular-nums"></span>
        <div class="flex flex-wrap items-center gap-1.5">
          <button type="button" data-add-delay="30" class="px-2.5 sm:px-2 py-1.5 sm:py-1 rounded-md bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] hover:border-[#CC5E3E] hover:text-[#CC5E3E] transition cursor-pointer">+30分</button>
          <button type="button" data-add-delay="60" class="px-2.5 sm:px-2 py-1.5 sm:py-1 rounded-md bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] hover:border-[#CC5E3E] hover:text-[#CC5E3E] transition cursor-pointer">+1時</button>
          <button type="button" data-add-delay="120" class="px-2.5 sm:px-2 py-1.5 sm:py-1 rounded-md bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] hover:border-[#CC5E3E] hover:text-[#CC5E3E] transition cursor-pointer">+2時</button>
          <button type="button" data-add-delay="180" class="px-2.5 sm:px-2 py-1.5 sm:py-1 rounded-md bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] hover:border-[#CC5E3E] hover:text-[#CC5E3E] transition cursor-pointer">+3時</button>
          <button id="delay-reset-btn" type="button" class="px-2.5 sm:px-2 py-1.5 sm:py-1 rounded-md bg-[#FDEBD6] text-[#7A685E] hover:text-[#382A23] transition cursor-pointer">恢復原定</button>
        </div>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-6 gap-3 sm:gap-2.5 text-base sm:text-xs">
        <div class="col-span-2">
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">新出發日期</label>
          <input id="delay-date" type="date" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#CC5E3E]" />
        </div>
        <div>
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">新出發時間</label>
          <input id="delay-start" type="time" class="w-full px-3 sm:px-2.5 py-2 sm:py-1.5 rounded-lg bg-[#FFFDF9] border border-[#EADBC8] text-[#382A23] focus:outline-none focus:border-[#CC5E3E]" />
        </div>
        <div>
          <label class="block text-sm sm:text-[11px] text-[#7A685E] mb-1">新抵達時間</label>
